# Nginx configuration for Automation Execution Platform
# Handles SSL termination, proxying, gzip, and security headers

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API proxy
    location /api/ {
        # PRE-EXISTING BUG, fixed here: nginx's default client_max_body_size
        # is 1m, and nothing in this file raised it — so every upload
        # endpoint behind this proxy 413'd at 1MB no matter what the backend
        # allowed. That silently broke SOW document import (backend cap
        # 15MB), reference screenshots (10MB), transcripts (10MB), design
        # images, and Android APKs (200MB). 256m clears every non-media cap
        # in the API with room to spare; the two large media routes below
        # raise it further still.
        client_max_body_size 256m;
        # Large media uploads — walkthrough videos (up to VISUAL_VIDEO_MAX_MB,
        # default 500) and SOW meeting recordings (SOW_MAX_RECORDING_MB,
        # default 300). Without this block nginx applies its 1MB default and
        # 413s the request before FastAPI ever sees it.
        #
        # proxy_request_buffering off matters as much as the size: with
        # buffering on (the default) nginx spools the entire body to its own
        # disk before forwarding a single byte, which both doubles the disk
        # write and defeats the backend's streaming size check — the upload
        # would be fully received before it could be rejected. Off means the
        # body streams straight through and an over-cap upload is cut short
        # by the backend's own 413.
        #
        # Scoped to these two routes deliberately: every other API endpoint
        # keeps the 1MB default, so this does not turn the whole API into an
        # unbounded upload target.
        location ~ ^/api/(v1/visual-audits/video|v1/sow/documents/[^/]+/sources/recording)$ {
            client_max_body_size 512m;
            client_body_timeout 600s;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 429 = @rate_limited;
        }

        # Rate limiting — stricter on auth routes
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom 429 response
            error_page 429 = @rate_limited;
        }

        # General API rate limiting
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        error_page 429 = @rate_limited;
    }

    # Custom rate-limited response
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error": "Rate limit exceeded. Please try again later."}';
    }

    # Health endpoint
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js) — all other routes
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
