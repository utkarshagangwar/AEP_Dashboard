services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - aep_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../automation:/automation
      - visual_qa_data:/app/visual_qa_data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AUTOMATION_ROOT: /automation
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_KEYS: ${GOOGLE_API_KEYS:-}
      GOOGLE_KEY_COOLDOWN_S: ${GOOGLE_KEY_COOLDOWN_S:-21600}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      VIBE_TEST_SOFT_TIME_LIMIT_S: ${VIBE_TEST_SOFT_TIME_LIMIT_S:-21600}
      VIBE_TEST_HARD_TIME_LIMIT_S: ${VIBE_TEST_HARD_TIME_LIMIT_S:-21900}
      # AXON metering gateway — same allowlist gotcha as SOW_ENABLED below:
      # was set in .env but never listed here, so ai_runner.py's AXON
      # fallback and the AI Usage page's per-key table never saw it.
      AXON_API_KEY: ${AXON_API_KEY:-}
      AXON_BASE_URL: ${AXON_BASE_URL:-}
      VISUAL_AUDIT_ENABLED: ${VISUAL_AUDIT_ENABLED:-false}
      VISUAL_DATA_DIR: /app/visual_qa_data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FIGMA_API_TOKEN: ${FIGMA_API_TOKEN:-}
      VISUAL_LLM_PRIMARY: ${VISUAL_LLM_PRIMARY:-axon/gemini-flash-latest}
      VISUAL_LLM_FALLBACKS: ${VISUAL_LLM_FALLBACKS:-gemini/gemini-2.5-flash-lite,gemini/gemini-2.5-flash}
      VISUAL_LLM_TIMEOUT_S: ${VISUAL_LLM_TIMEOUT_S:-120}
      VISUAL_LLM_MAX_RETRIES: ${VISUAL_LLM_MAX_RETRIES:-2}
      VISUAL_DIFF_THRESHOLD: ${VISUAL_DIFF_THRESHOLD:-0.1}
      VISUAL_DIFF_MIN_REGION_PX: ${VISUAL_DIFF_MIN_REGION_PX:-64}
      VISUAL_FAIL_MISMATCH_PCT: ${VISUAL_FAIL_MISMATCH_PCT:-1.0}
      VISUAL_VIDEO_MODEL: ${VISUAL_VIDEO_MODEL:-gemini-3.5-flash}
      VISUAL_VIDEO_FALLBACK: ${VISUAL_VIDEO_FALLBACK:-gemini-2.5-flash}
      VISUAL_VIDEO_MAX_MB: ${VISUAL_VIDEO_MAX_MB:-500}
      # SOW Creation & Rewrite (see SOW_FEATURE_PLAN.md) — master switch, same
      # convention as VISUAL_AUDIT_ENABLED above. This entry is the fix for
      # the 2026-07-20 bug where SOW_ENABLED=true in .env had no effect: this
      # file's per-service `environment:` block is an explicit allowlist, not
      # a blanket .env passthrough — a var only reaches the container if it's
      # listed here too, regardless of what .env sets.
      SOW_ENABLED: ${SOW_ENABLED:-false}
      SOW_MAX_RECORDING_MB: ${SOW_MAX_RECORDING_MB:-500}
      SOW_MAX_RECORDING_MINUTES: ${SOW_MAX_RECORDING_MINUTES:-60}
      # Project Intelligence — same allowlist gotcha as SOW_ENABLED/AXON_API_KEY
      # above: setting these in .env alone does nothing, they must be listed
      # here too. PI_ENABLED is the master switch (default off); the three
      # PI_CAPTURE_* flags are opt-out (default on once PI_ENABLED=true) and
      # only need to be set when you want to disable one specific capture
      # source. Must match celery_worker's block below — the worker is where
      # ingest_rf_capture/ingest_vibe_capture actually run.
      PI_ENABLED: ${PI_ENABLED:-false}
      PI_CAPTURE_RF: ${PI_CAPTURE_RF:-true}
      PI_CAPTURE_VIBE: ${PI_CAPTURE_VIBE:-true}
      PI_CAPTURE_BEHAVIOR_NOTES: ${PI_CAPTURE_BEHAVIOR_NOTES:-true}
      # Phase 2 — Change Detection & Healing. PI_HEAL_LEDGER is its own kill
      # switch, default OFF regardless of PI_ENABLED (spec table 16: "off
      # until Phase 2 is signed off") — detection/flags work either way,
      # only the sow_requirements_ledger WRITE is gated by this. The two
      # tuning knobs below have safe in-code defaults (3 visits / 0.93
      # similarity) and only need to be set to override them per project.
      PI_HEAL_LEDGER: ${PI_HEAL_LEDGER:-false}
      PI_REMOVED_THRESHOLD: ${PI_REMOVED_THRESHOLD:-3}
      PI_RENAME_SIMILARITY_THRESHOLD: ${PI_RENAME_SIMILARITY_THRESHOLD:-0.93}
      # Phase 3 — Active Crawler & Visual. PI_CRAWL_ENABLED is its own kill
      # switch, default OFF regardless of PI_ENABLED (spec table 16: "off
      # until Phase 3") — a project must ALSO have pi_crawl_enabled set on
      # its own project record (§28 Q2: "opt-in per project") before any of
      # its environments are ever crawled. The crawl itself runs in
      # celery_worker (see that block below), but api/v1/project_
      # intelligence.py's design-pattern endpoints run here, so both
      # containers need PI_ENABLED regardless — these crawl-specific knobs
      # only matter where the crawl runs, listed here anyway to keep both
      # blocks identical and avoid the exact allowlist gap Phase 1 hit.
      PI_CRAWL_ENABLED: ${PI_CRAWL_ENABLED:-false}
      PI_ARTIFACT_RETENTION_DAYS: ${PI_ARTIFACT_RETENTION_DAYS:-90}
      PI_CRAWL_MAX_STEPS: ${PI_CRAWL_MAX_STEPS:-40}
      PI_CRAWL_MAX_DURATION_S: ${PI_CRAWL_MAX_DURATION_S:-1200}
      PI_CRAWL_MAX_SCREENSHOTS: ${PI_CRAWL_MAX_SCREENSHOTS:-5}
      PI_CRAWL_STAGGER_S: ${PI_CRAWL_STAGGER_S:-300}
      PI_CAPTURE_DESIGN_PATTERNS: ${PI_CAPTURE_DESIGN_PATTERNS:-true}
      # Phase 4 — AI Context Feedback Loop. PI_CONTEXT_ENABLED is its own
      # kill switch, default OFF regardless of PI_ENABLED (spec table 16:
      # "off until Phase 4") — turning it on changes what every AI run's
      # agent actually sees (its goal is augmented with a generated
      # brief), so it stays a deliberate admin opt-in. Brief injection
      # itself runs in celery_worker (ai_execution.run_ai_test_task), but
      # api/v1/project_intelligence.py's context-effectiveness endpoint
      # runs here, so both containers need these regardless — same
      # both-blocks-identical convention as Phase 3.
      PI_CONTEXT_ENABLED: ${PI_CONTEXT_ENABLED:-false}
      PI_CONTEXT_BUDGET_TOKENS: ${PI_CONTEXT_BUDGET_TOKENS:-1200}
      PI_CONTEXT_BUILD_TIMEOUT_S: ${PI_CONTEXT_BUILD_TIMEOUT_S:-5}
      # Phase 5 — Scale (pgvector + semantic search). Its own switch,
      # default OFF, deliberately separate from PI_ENABLED and every other
      # PI_* switch above (confirmed directly at Phase 5 kickoff, not
      # inferred) — turning this on requires the `vector` Postgres
      # extension to already be installed on the DB server (see alembic
      # migration 0053's docstring) and the `pgvector` pip package
      # (requirements.txt) to be present; neither is true by default, so
      # this stays off until both are deliberately set up. Reuses
      # GOOGLE_API_KEY(S)/GEMINI_API_KEY above for the embedding model —
      # no separate credential.
      PI_SEMANTIC_SEARCH_ENABLED: ${PI_SEMANTIC_SEARCH_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Must be identical to celery_worker's value below — both
      # encrypt/decrypt the same ai_credential_profiles rows in separate
      # processes. Unset in either = an ephemeral, process-local key that
      # can't decrypt what the other container encrypted.
      AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
      # Android Vibe Testing — cloud device farm (BrowserStack App Automate).
      # Backend needs these for APK upload; celery_worker needs them for
      # session start/session-details (see app/services/device_farm.py).
      BROWSERSTACK_USERNAME: ${BROWSERSTACK_USERNAME:-}
      BROWSERSTACK_ACCESS_KEY: ${BROWSERSTACK_ACCESS_KEY:-}
      ANDROID_MAX_APK_MB: ${ANDROID_MAX_APK_MB:-200}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aep_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    # -B runs Celery Beat embedded in this same process (safe here since only
    #    one celery_worker instance/replica runs — beat schedule is defined in
    #    celery_app.py and currently just handles periodic stale-run reconciliation).
    # --concurrency is now explicit instead of Celery's implicit CPU-count
    #    default, so cross-suite parallelism is a documented, tunable knob
    #    (CELERY_CONCURRENCY in .env) rather than an accident of the host's
    #    reported CPU count.
    # Xvfb :99 gives ai_runner.py's Chromium subprocess (launched without
    #    --headless, see _run_with_chromium) a real X display to render to --
    #    testing whether IG's app treats a headless/no-GPU session
    #    differently from a headed one for the admin-bypass cookie flow.
    command: sh -c "Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp & sleep 2 && celery -A app.workers.celery_app:celery_app worker -B --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}"
    volumes:
      - ../automation:/automation
      - visual_qa_data:/app/visual_qa_data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AUTOMATION_ROOT: /automation
      PABOT_PROCESSES: ${PABOT_PROCESSES:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_KEYS: ${GOOGLE_API_KEYS:-}
      GOOGLE_KEY_COOLDOWN_S: ${GOOGLE_KEY_COOLDOWN_S:-21600}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      VIBE_TEST_SOFT_TIME_LIMIT_S: ${VIBE_TEST_SOFT_TIME_LIMIT_S:-21600}
      VIBE_TEST_HARD_TIME_LIMIT_S: ${VIBE_TEST_HARD_TIME_LIMIT_S:-21900}
      # AXON metering gateway — must match backend's block above (this
      # worker also builds Hands/Brain LLM clients for queued runs).
      AXON_API_KEY: ${AXON_API_KEY:-}
      AXON_BASE_URL: ${AXON_BASE_URL:-}
      VISUAL_AUDIT_ENABLED: ${VISUAL_AUDIT_ENABLED:-false}
      VISUAL_DATA_DIR: /app/visual_qa_data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FIGMA_API_TOKEN: ${FIGMA_API_TOKEN:-}
      VISUAL_LLM_PRIMARY: ${VISUAL_LLM_PRIMARY:-axon/gemini-flash-latest}
      VISUAL_LLM_FALLBACKS: ${VISUAL_LLM_FALLBACKS:-gemini/gemini-2.5-flash-lite,gemini/gemini-2.5-flash}
      VISUAL_LLM_TIMEOUT_S: ${VISUAL_LLM_TIMEOUT_S:-120}
      VISUAL_LLM_MAX_RETRIES: ${VISUAL_LLM_MAX_RETRIES:-2}
      VISUAL_DIFF_THRESHOLD: ${VISUAL_DIFF_THRESHOLD:-0.1}
      VISUAL_DIFF_MIN_REGION_PX: ${VISUAL_DIFF_MIN_REGION_PX:-64}
      VISUAL_FAIL_MISMATCH_PCT: ${VISUAL_FAIL_MISMATCH_PCT:-1.0}
      VISUAL_VIDEO_MODEL: ${VISUAL_VIDEO_MODEL:-gemini-3.5-flash}
      VISUAL_VIDEO_FALLBACK: ${VISUAL_VIDEO_FALLBACK:-gemini-2.5-flash}
      VISUAL_VIDEO_MAX_MB: ${VISUAL_VIDEO_MAX_MB:-500}
      # SOW Creation & Rewrite — must match backend's block above (this is
      # the worker; sow_ledger.py's Celery tasks run here). See backend's
      # comment above for why this entry exists at all.
      SOW_ENABLED: ${SOW_ENABLED:-false}
      SOW_MAX_RECORDING_MB: ${SOW_MAX_RECORDING_MB:-500}
      SOW_MAX_RECORDING_MINUTES: ${SOW_MAX_RECORDING_MINUTES:-60}
      # Project Intelligence — must match backend's block above (this is the
      # worker; workers/tasks/pi_ingest.py's Celery tasks and the beat-
      # scheduled sweep run here, not in the API process). See backend's
      # comment above for why these entries exist at all.
      PI_ENABLED: ${PI_ENABLED:-false}
      PI_CAPTURE_RF: ${PI_CAPTURE_RF:-true}
      PI_CAPTURE_VIBE: ${PI_CAPTURE_VIBE:-true}
      PI_CAPTURE_BEHAVIOR_NOTES: ${PI_CAPTURE_BEHAVIOR_NOTES:-true}
      # Phase 2 — must match backend's block above. apply_heal() (services/
      # pi_heal.py) runs wherever the API request lands, i.e. the backend
      # container, not here — but classification (services/pi_drift.py)
      # runs inline inside ingest_rf_capture/ingest_vibe_capture, which DO
      # run here, so PI_REMOVED_THRESHOLD / PI_RENAME_SIMILARITY_THRESHOLD
      # must be set on this container too, not just backend's.
      PI_HEAL_LEDGER: ${PI_HEAL_LEDGER:-false}
      PI_REMOVED_THRESHOLD: ${PI_REMOVED_THRESHOLD:-3}
      PI_RENAME_SIMILARITY_THRESHOLD: ${PI_RENAME_SIMILARITY_THRESHOLD:-0.93}
      # Phase 3 — must match backend's block above. This is where the crawl
      # actually runs (workers/tasks/pi_crawl.py's Beat-scheduled tasks),
      # so these are the values that matter in practice; kept identical to
      # backend's block regardless (see that comment).
      PI_CRAWL_ENABLED: ${PI_CRAWL_ENABLED:-false}
      PI_ARTIFACT_RETENTION_DAYS: ${PI_ARTIFACT_RETENTION_DAYS:-90}
      PI_CRAWL_MAX_STEPS: ${PI_CRAWL_MAX_STEPS:-40}
      PI_CRAWL_MAX_DURATION_S: ${PI_CRAWL_MAX_DURATION_S:-1200}
      PI_CRAWL_MAX_SCREENSHOTS: ${PI_CRAWL_MAX_SCREENSHOTS:-5}
      PI_CRAWL_STAGGER_S: ${PI_CRAWL_STAGGER_S:-300}
      PI_CAPTURE_DESIGN_PATTERNS: ${PI_CAPTURE_DESIGN_PATTERNS:-true}
      # Phase 4 — must match backend's block above. This is where context
      # briefs are actually built and injected
      # (ai_execution.run_ai_test_task), so these are the values that
      # matter in practice.
      PI_CONTEXT_ENABLED: ${PI_CONTEXT_ENABLED:-false}
      PI_CONTEXT_BUDGET_TOKENS: ${PI_CONTEXT_BUDGET_TOKENS:-1200}
      PI_CONTEXT_BUILD_TIMEOUT_S: ${PI_CONTEXT_BUILD_TIMEOUT_S:-5}
      # Phase 5 — must match backend's block above. This is where the
      # nightly backfill/cleanup tasks and the per-approval embed hook
      # actually run (workers/tasks/pi_embed.py).
      PI_SEMANTIC_SEARCH_ENABLED: ${PI_SEMANTIC_SEARCH_ENABLED:-false}
      # Must match backend's value above — see its comment.
      AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
      # Android Vibe Testing — see backend's block above for why both
      # containers need the BrowserStack credentials. The per-run ceilings
      # below only matter where execution actually happens (here).
      BROWSERSTACK_USERNAME: ${BROWSERSTACK_USERNAME:-}
      BROWSERSTACK_ACCESS_KEY: ${BROWSERSTACK_ACCESS_KEY:-}
      ANDROID_MAX_DURATION_S: ${ANDROID_MAX_DURATION_S:-480}
      ANDROID_MAX_STEPS: ${ANDROID_MAX_STEPS:-25}
      ANDROID_NEW_COMMAND_TIMEOUT_S: ${ANDROID_NEW_COMMAND_TIMEOUT_S:-120}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aep_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      FASTAPI_URL: http://backend:8000
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      - backend
    networks:
      - aep_network

  nginx:
    build:
      context: ./docker
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./docker/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aep_network

networks:
  aep_network:
    driver: bridge

volumes:
  # Shared between backend (API uploads) and celery_worker (SOW/video/Figma
  # parsing, screenshot capture) — without this the worker can't see files
  # the API wrote, and vice versa for generated screenshots/diffs.
  visual_qa_data:
