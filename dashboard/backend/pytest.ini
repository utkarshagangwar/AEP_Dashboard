[pytest]
# Unit tests only. These must run with no database, no network, no API keys
# and no browser -- anything needing those belongs in golden_tests/ (manual
# harness) or the Robot Framework suites, not here.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    slow: property-based or fixture-heavy tests (deselect with -m "not slow")
